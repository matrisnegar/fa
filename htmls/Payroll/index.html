const catalogPathParts = location.pathname.split('/').filter(Boolean);
const catalogModule = decodeURIComponent((catalogPathParts.at(-1) === 'index.html' ? catalogPathParts.at(-2) : catalogPathParts.at(-1)) || 'Asset');
function startCatalog(data){'use strict';const $=id=>document.getElementById(id);const state={lang:'en',selected:data.menus[0]?.id||'',query:''};try{const l=localStorage.getItem('mn-catalog-lang');if(data.languages.includes(l))state.lang=l}catch(e){}

  if(urlLanguage && data.languages.includes(urlLanguage)) state.lang=urlLanguage;const v=(obj)=>obj?.[state.lang]||obj?.en||'';function icon(name){if(!['clipboard-list','truck','file-text','chart','layers','trending-down','book-open','sparkles','settings','wrench'].includes(name))name='file-text';return '<svg class="symbol" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-'+name+'"></use></svg>'}function txt(el,val){el.textContent=val}function field(n){return v(data.ui[n])}function matchingMenu(m,q){return [v(m.title),...m.items.flatMap(it=>[v(it.title),v(it.description)])].join(' ').toLocaleLowerCase().includes(q)}function matchingItem(it,q){return [v(it.title),v(it.description)].join(' ').toLocaleLowerCase().includes(q)}function render(){document.title='Matris Negar | '+v(data.software?.name);const rtl=['ar','fa'].includes(state.lang);document.documentElement.lang=state.lang;document.documentElement.dir=rtl?'rtl':'ltr';$('language').value=state.lang;txt($('langLabel'),field('language'));
  txt($('catalogCaption'),field('overview'));
  const demoTranslations={fa:'درخواست دمو',ar:'طلب عرض توضيحي',en:'Request Demo',de:'Demo anfordern',fr:'Demander une démo',it:'Richiedi una demo',es:'Solicitar demostración',ru:'Запросить демо',pt:'Solicitar demonstração',tr:'Demo talep et'};
  txt($('requestDemo'),demoTranslations[state.lang]||demoTranslations.en);
  const homeTranslations={fa:'صفحه اصلی',ar:'الصفحة الرئيسية',en:'Home',de:'Startseite',fr:'Accueil',it:'Pagina iniziale',es:'Inicio',ru:'Главная',pt:'Página inicial',tr:'Ana Sayfa'};
  txt($('returnHome'),'⌂ '+(homeTranslations[state.lang]||homeTranslations.en));
  $('returnHome').href='../../MatrisSell-'+encodeURIComponent(state.lang)+'.html#home';
  $('requestDemo').href='../../MatrisSell-'+encodeURIComponent(state.lang)+'.html?demo='+encodeURIComponent(catalogModule)+'#contact';txt($('sidebarTitle'),field('menu'));txt($('sourceNote'),field('note'));$('search').placeholder=field('search');const q=state.query.trim().toLocaleLowerCase();const visible=data.menus.filter(m=>!q||matchingMenu(m,q));if(q&&visible.length&&!visible.some(m=>m.id===state.selected))state.selected=visible[0].id;$('menus').replaceChildren();visible.forEach(m=>{let btn=document.createElement('button');btn.type='button';btn.className='menu'+(state.selected===m.id?' active':'');btn.setAttribute('aria-current',state.selected===m.id?'true':'false');btn.innerHTML='<span class="menuicon">'+icon(m.icon)+'</span><span class="menuname"></span><span class="menucount"></span>';txt(btn.querySelector('.menuname'),v(m.title));txt(btn.querySelector('.menucount'),m.items.length||'—');btn.onclick=()=>{state.selected=m.id;render()};$('menus').append(btn)});let m=data.menus.find(m=>m.id===state.selected)||data.menus[0];if(!visible.length){txt($('selectedTitle'),field('noresults'));txt($('featureCount'),'');$('pageIcon').innerHTML=icon('chart');$('cards').innerHTML='<div class="empty">'+field('noresults')+'</div>';return}txt($('selectedTitle'),v(m.title));let itemList=!q||v(m.title).toLocaleLowerCase().includes(q)?m.items:m.items.filter(it=>matchingItem(it,q));txt($('featureCount'),itemList.length+' '+field('items'));$('pageIcon').innerHTML=icon(m.icon);$('cards').replaceChildren();if(!itemList.length){const empty=document.createElement('div');empty.className='empty';empty.style.gridColumn='1/-1';const ball=document.createElement('div');ball.className='emptyicon';ball.textContent='⌁';const text=document.createElement('p');text.textContent=m.items.length?field('noresults'):field('noitems');empty.append(ball,text);$('cards').append(empty)}else itemList.forEach((it,i)=>{const div=document.createElement('article');div.className='feature';const heading=document.createElement('div');heading.className='fhead';const n=document.createElement('span');n.className='fnum';n.textContent=String(m.items.indexOf(it)+1).padStart(2,'0');const h=document.createElement('h3');h.textContent=v(it.title);heading.append(n,h);const p=document.createElement('p');p.textContent=v(it.description);div.append(heading,p);$('cards').append(div)});}$('language').addEventListener('change',e=>{state.lang=e.target.value;try{localStorage.setItem('mn-catalog-lang',state.lang)}catch(e){}render()});$('search').addEventListener('input',e=>{state.query=e.target.value;render()});render()}

// Load the JSON located beside this HTML file. No file picker is required.
(async function () {
  const fileName = 'data.json';
  const url = new URL(fileName, document.baseURI);
  try {
    const response = await fetch(url, { cache: 'no-cache' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (!data || !Array.isArray(data.menus) || !data.ui || !Array.isArray(data.languages)) {
      throw new Error('Invalid JSON structure');
    }
    startCatalog(data);
  } catch (error) {
    const message = document.createElement('div');
    message.style.cssText = 'max-width:700px;margin:36px auto;padding:24px;border:1px solid #d7e4f0;background:#fff;border-radius:16px;color:#193755;font:15px/1.8 Segoe UI,Tahoma,Arial,sans-serif';
    const heading = document.createElement('h2');
    heading.textContent = 'Unable to load ' + fileName;
    const text = document.createElement('p');
    text.textContent = location.protocol === 'file:'
      ? 'Your browser blocks reading local JSON files when opening HTML via file://. Run START_LOCAL.bat (Windows) or host this folder on a web server. The JSON will then load automatically.'
      : 'Keep data.json in the same folder as this HTML file. Details: ' + error.message;
    message.append(heading, text);
    document.querySelector('.app').replaceWith(message);
  }
})();
</script></body></html>
