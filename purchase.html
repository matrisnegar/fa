(()=>{'use strict';const $=id=>document.getElementById(id),langs=['ar','de','en','es','fa','fr','it','pt','ru','tr'];const query=new URLSearchParams(location.search);let locale=langs.includes(query.get('lang'))?query.get('lang'):(langs.includes(window.MATRIS_BOOTSTRAP_LANG)?window.MATRIS_BOOTSTRAP_LANG:''),catalog=null,selected=new Set(),pending=false,saved=null,attempt=null,loadSeq=0,prefill=null;

const trustedSource=openerSource||(embedded&&window.parent!==window?window.parent:null);if(embedded)document.body.classList.add('embedded');$('language').value=locale||'en';
const t=key=>catalog&&catalog.ui[key]||({loading:'Please wait…',networkError:'Unable to load prices. Try again.',setupRequired:'The sales service needs setup.',invalidFields:'Check the required fields.',serverError:'The service could not confirm the order.'}[key]||key);
const copyWords={"fa": ["کپی سفارش برای ایمیل", "سفارش در حافظه کپی شد؛ اکنون در ایمیل جای‌گذاری کنید.", "کپی خودکار ممکن نشد؛ متن زیر را انتخاب و کپی کنید.", "پیش‌نویس سفارش — ثبت آن تأیید نشده است.", "سفارش ثبت‌شده", "ابتدا محصولی را انتخاب کنید."], "en": ["Copy order for email", "Order copied. Paste it into your email.", "Automatic copying was unavailable. Select and copy the text below.", "Order draft — registration has not been confirmed.", "Recorded order", "Select a product first."], "ar": ["نسخ الطلب للبريد الإلكتروني", "تم نسخ الطلب. الصقه في بريدك الإلكتروني.", "تعذر النسخ التلقائي. حدد النص أدناه وانسخه.", "مسودة طلب — لم يتم تأكيد التسجيل.", "طلب مسجل", "اختر منتجًا أولاً."], "de": ["Bestellung für E-Mail kopieren", "Bestellung kopiert. In die E-Mail einfügen.", "Automatisches Kopieren nicht verfügbar. Text unten markieren und kopieren.", "Bestellentwurf — Registrierung nicht bestätigt.", "Registrierte Bestellung", "Wählen Sie zuerst ein Produkt."], "fr": ["Copier la commande pour un e-mail", "Commande copiée. Collez-la dans votre e-mail.", "Copie automatique indisponible. Sélectionnez et copiez le texte ci-dessous.", "Brouillon — enregistrement non confirmé.", "Commande enregistrée", "Sélectionnez un produit."], "it": ["Copia ordine per e-mail", "Ordine copiato. Incollalo nella tua e-mail.", "Copia automatica non disponibile. Seleziona e copia il testo sotto.", "Bozza ordine — registrazione non confermata.", "Ordine registrato", "Seleziona prima un prodotto."], "es": ["Copiar pedido para correo", "Pedido copiado. Péguelo en su correo.", "Copia automática no disponible. Seleccione y copie el texto de abajo.", "Borrador — registro no confirmado.", "Pedido registrado", "Seleccione un producto."], "pt": ["Copiar pedido para e-mail", "Pedido copiado. Cole no seu e-mail.", "Cópia automática indisponível. Selecione e copie o texto abaixo.", "Rascunho — registro não confirmado.", "Pedido registrado", "Selecione um produto."], "ru": ["Копировать заказ для письма", "Заказ скопирован. Вставьте его в письмо.", "Автокопирование недоступно. Выделите и скопируйте текст ниже.", "Черновик — регистрация не подтверждена.", "Зарегистрированный заказ", "Сначала выберите товар."], "tr": ["Siparişi e-posta için kopyala", "Sipariş kopyalandı. E-postanıza yapıştırın.", "Otomatik kopyalama kullanılamıyor. Aşağıdaki metni seçip kopyalayın.", "Sipariş taslağı — kayıt onaylanmadı.", "Kaydedilmiş sipariş", "Önce bir ürün seçin."]};

function status(key,good=false){$('status').hidden=false;$('status').className='status'+(good?' good':'');$('status').textContent=t(key);}
function attemptReference(){if(!attempt)return;const line=document.createElement('p');line.textContent=t('reference')+': '+attempt.id;line.dir='auto';line.className='ref';$('status').append(line);}
function uuid(){if(crypto.randomUUID)return crypto.randomUUID();const b=crypto.getRandomValues(new Uint8Array(16));b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);}

function timed(p){let timer;return Promise.race([p,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('NETWORK_ERROR')),90000);})]).finally(()=>clearTimeout(timer));}
async function getCatalog(lang){if(appHost())return timed(new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).loadCatalog(lang)));const u=new URL(window.MATRIS_SALES_ENDPOINT);u.searchParams.set('action','catalog');u.searchParams.set('lang',lang);const response=await timed(fetch(u.href,{credentials:'omit',redirect:'follow'}));if(!response.ok)throw Error('NETWORK_ERROR');return response.json();}
async function sendOrder(data){
 if(appHost())return timed(new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).submitOrder(data)));
 return new Promise((resolve,reject)=>{
 const frame=document.createElement('iframe'),form=document.createElement('form');frame.name='matris-order-'+data.nonce;frame.hidden=true;frame.title='Order confirmation';form.hidden=true;form.method='POST';form.action=window.MATRIS_SALES_ENDPOINT;form.target=frame.name;form.acceptCharset='UTF-8';
 const cleanup=()=>{clearTimeout(timer);window.removeEventListener('message',receive);frame.remove();form.remove();};
 const receive=event=>{let host;try{const u=new URL(event.origin);if(u.protocol!=='https:')return;host=u.hostname;}catch(_){return;}
 if(host!=='script.google.com'&&host!=='script.googleusercontent.com'&&!/^[a-z0-9-]+-script\.googleusercontent\.com$/.test(host))return;

 });
}
function applyCatalog(c){catalog=c;locale=c.language;document.documentElement.lang=locale;document.documentElement.dir=c.direction;$('language').value=locale;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('copyOrder').textContent=copyLabel(0);$('copyText').setAttribute('aria-label',copyLabel(0));$('copyNotice').textContent='';$('copyPanel').hidden=true;$('seller').textContent=c.sellerName;$('footer').textContent=c.sellerName;selected=new Set([...selected].filter(id=>c.products.some(p=>p.id===id&&p.priceCents!==null)));renderProducts();renderSummary();$('consent').checked=false;}

function quote(){const items=catalog.products.filter(p=>selected.has(p.id)),subtotalCents=items.reduce((s,p)=>s+p.priceCents,0),discountCents=items.reduce((s,p)=>s+p.discountCents,0);return {subtotalCents,discountCents,totalCents:subtotalCents-discountCents,reason:discountCents>0?catalog.discountReason:t('discountNone')};}
function renderSummary(){const q=quote();$('subtotal').textContent=money(q.subtotalCents);$('discount').textContent=money(q.discountCents);$('total').textContent=money(q.totalCents);$('reason').textContent=q.reason;$('selectedNames').textContent=catalog.products.filter(p=>selected.has(p.id)).map(p=>p.name).join(' · ');}

const normalize=s=>String(s).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));
function fields(){return {fullName:$('fullName').value.trim(),company:$('company').value.trim(),email:$('email').value.trim(),country:$('country').value.trim(),whatsapp:normalize($('whatsapp').value).replace(/[\s()\-]/g,''),telegram:$('telegram').value.trim(),notes:$('notes').value.trim()};}
function valid(){const b=fields();for(const id of ['fullName','company','country'])$(id).setCustomValidity(b[id]?'':t('invalidFields'));const tg=b.telegram.replace(/^https?:\/\//i,'').replace(/^t\.me\//i,'').replace(/^@/,'').replace(/\/$/,'');$('whatsapp').setCustomValidity((!b.whatsapp||/^\+[1-9]\d{7,14}$/.test(b.whatsapp))?'':t('phoneHint'));$('telegram').setCustomValidity((!b.telegram||/^[A-Za-z][A-Za-z0-9_]{4,31}$/.test(tg))?'':t('tgHint'));return $('orderForm').reportValidity();}
function lock(value){pending=value;$('orderForm').setAttribute('aria-busy',String(value));$('language').disabled=value||!!saved;document.querySelectorAll('#orderForm input,#orderForm textarea').forEach(el=>el.disabled=value||!!saved);$('submit').disabled=value||!!saved;$('submit').textContent=value?t('loading'):t('submit');renderProducts();}
$('orderForm').addEventListener('submit',async e=>{e.preventDefault();if(pending||saved||!catalog)return;if(!selected.size){status('empty');$('productCard').scrollIntoView({behavior:'smooth'});return;}if(!valid()){status('invalidFields');return;}const b=fields(),q=quote(),items=JSON.stringify([...selected].sort()),signature=JSON.stringify([locale,b,items,catalog.revision,q.totalCents,sourceInquiryId]);if(!attempt||attempt.signature!==signature)attempt={signature,id:uuid(),token:token()};const nonce=uuid(),data={action:'order',...b,inquiryId:sourceInquiryId,lang:locale,items,expectedTotalCents:String(q.totalCents),revision:catalog.revision,submissionToken:attempt.token,requestId:attempt.id,nonce,parentOrigin:location.origin,consent:'yes',orderConsent:'yes',website:$('website').value};lock(true);status('loading');try{const r=await sendOrder(data);if(!r||r.type!=='matris-order-result'||r.requestId!==data.requestId||r.nonce!==nonce)throw Error('NETWORK_ERROR');if(r.code==='PRICE_CHANGED'){applyCatalog(r.catalog);attempt=null;$('consent').checked=false;status('priceChanged');return;}if(!r.ok){const key={INVALID_FIELDS:'invalidFields',INVALID_ITEMS:'priceChanged',INVALID_COMBINATION:'selectBundleAlone',RATE_LIMITED:'rateLimit',SETUP_REQUIRED:'setupRequired',HEADERS_MISMATCH:'setupRequired',LEAD_SHEET_AMBIGUOUS:'setupRequired',CATALOG_INVALID:'setupRequired'}[r.code]||'serverError';status(key);attemptReference();return;}saved={id:r.requestId,html:r.invoiceHtml};$('receipt').hidden=false;$('reference').textContent=r.requestId;status('success',true);const mail=document.createElement('p');mail.textContent=t(/(?:^|;)SENDER_SENT(?:;|$)/.test(r.emailStatus||'')?'mailSent':'mailPending');$('status').append(mail);bridge('matris-order-recorded',{orderId:r.requestId});}catch(_){status('networkError');attemptReference();}finally{lock(false);}});
document.querySelectorAll('#orderForm input,#orderForm textarea').forEach(el=>el.addEventListener('input',()=>{if(el.id!=='consent'&&el.id!=='privacy'){$('consent').checked=false;attempt=null;}el.setCustomValidity('');}));
$('language').addEventListener('change',()=>{if(pending||saved)return;locale=$('language').value;attempt=null;$('consent').checked=false;load();});$('retryLoad').addEventListener('click',load);

function orderEmailText(){const b=fields(),q=quote();const lines=[catalog.sellerName,copyLabel(saved?4:3)];if(saved||attempt)lines.push(t('reference')+': '+(saved?saved.id:attempt.id));lines.push('');for(const p of catalog.products.filter(p=>selected.has(p.id)))lines.push(p.name+' | '+t('unitPrice')+': '+money(p.priceCents)+' | '+t('discount')+': '+money(p.discountCents)+' | '+t('total')+': '+money(p.finalPriceCents));lines.push('',t('subtotal')+': '+money(q.subtotalCents),t('discount')+': '+money(q.discountCents),t('total')+': '+money(q.totalCents),t('reason')+': '+q.reason,'');for(const key of ['fullName','company','email','country','whatsapp','telegram','notes'])if(b[key])lines.push(t(key)+': '+b[key]);lines.push('',t('notPaid'));return lines.join('\n');}
$('copyOrder').addEventListener('click',async()=>{if(!catalog||!selected.size){$('copyNotice').textContent=copyLabel(5);return;}const text=orderEmailText();$('copyText').value=text;try{if(!navigator.clipboard||!navigator.clipboard.writeText)throw Error('CLIPBOARD_UNAVAILABLE');await navigator.clipboard.writeText(text);$('copyPanel').hidden=true;$('copyNotice').textContent=copyLabel(1);}catch(_){$('copyPanel').hidden=false;$('copyText').focus();$('copyText').select();$('copyNotice').textContent=copyLabel(2);}});

function blobUrl(){return URL.createObjectURL(new Blob([saved.html],{type:'text/html;charset=utf-8'}));}
$('download').addEventListener('click',()=>{if(!saved)return;const url=blobUrl(),a=document.createElement('a');a.href=url;a.download='Matris-'+saved.id+'.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);});
$('print').addEventListener('click',()=>{if(!saved)return;const url=blobUrl();const win=window.open(url,'_blank');if(win)win.opener=null;setTimeout(()=>URL.revokeObjectURL(url),60000);});
$('edit').addEventListener('click',()=>{saved=null;attempt=null;$('receipt').hidden=true;$('status').hidden=true;$('consent').checked=false;lock(false);load();});
function bridge(type,data={}){if(trustedSource)trustedSource.postMessage({type,...data},location.origin==='null'?'*':location.origin);}
function applyPrefill(data){if(!catalog||saved||pending){prefill=data;return;}for(const id of ['fullName','company','email','country'])if(typeof data[id]==='string'&&(!$(id).value||$(id).value===lastPrefill[id])){$(id).value=data[id].slice(0,$(id).maxLength);lastPrefill[id]=$(id).value;}if(!attempt&&typeof data.inquiryId==='string'&&/^[a-f0-9-]{36}$/i.test(data.inquiryId))sourceInquiryId=data.inquiryId;if(data.bundle){selected=new Set(catalog.products.some(p=>p.id==='full_suite'&&p.priceCents!==null)?['full_suite']:[]);}else if(Array.isArray(data.productIds)){const aliases={inventory:'inventory_assets',asset:'inventory_assets',fanoosh:'fanoos'};const ids=data.productIds.map(id=>aliases[id]||id);selected=new Set(ids.filter(id=>catalog.products.some(p=>p.id===id&&p.priceCents!==null)));if(selected.has('full_suite'))selected=new Set(['full_suite']);}renderProducts();renderSummary();prefill=null;}
window.addEventListener('message',e=>{if(!trustedSource||e.source!==trustedSource||e.origin!==location.origin||!e.data||e.data.type!=='matris-shop-prefill')return;applyPrefill(e.data);bridge('matris-shop-prefilled');if(openerSource){try{window.opener=null;}catch(_){}}});
if(window.ResizeObserver)new ResizeObserver(()=>bridge('matris-shop-height',{height:Math.ceil(document.documentElement.scrollHeight)})).observe(document.body);
load();bridge('matris-shop-ready');
})();
</script></body></html>
