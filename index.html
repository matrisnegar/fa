function setupDiagramSlideshow() {
  const stage = document.getElementById('diagram-stage');
  const status = document.getElementById('diagram-status');
  const count = document.getElementById('diagram-count');
  const previous = document.getElementById('diagram-prev');
  const next = document.getElementById('diagram-next');
  const play = document.getElementById('diagram-play');
  const diagramFolder = 'diagrams/' + encodeURIComponent(lang_page) + '/';
  const numberOfDiagrams = 10;
  const interval = 5000;
  const images = new Map();
  const formatNumber = new Intl.NumberFormat('fa-IR');
  let current = -1;
  let autoplay = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timer;
  let loading = false;

  function loadDiagram(index) {
    if (!images.has(index)) {
      const image = new Image();
      image.alt = 'دیاگرام نرم‌افزار ' + formatNumber.format(index + 1);
      const loaded = new Promise(resolve => {
        image.onload = () => resolve(image);
        image.onerror = () => resolve(null);
      });
      images.set(index, loaded);
      const filename = 'diagram' + String(index + 1).padStart(2, '0') + '.jpg';
      image.src = diagramFolder + filename;
    }
    return images.get(index);
  }

  function scheduleNext() {
    clearTimeout(timer);
    if (autoplay && !loading && current >= 0) {
      timer = setTimeout(() => showDiagram(current + 1, 1), interval);
    }
  }

  function updatePlayLabel() {
    play.textContent = autoplay ? 'توقف نمایش خودکار' : 'شروع نمایش خودکار';
  }

  async function showDiagram(start, direction) {
    if (loading) return;
    clearTimeout(timer);
    loading = true;
    previous.disabled = next.disabled = true;
    for (let step = 0; step < numberOfDiagrams; step++) {
      const index = (start + direction * step + numberOfDiagrams) % numberOfDiagrams;
      const image = await loadDiagram(index);
      if (!image) continue;
      stage.replaceChildren(image);
      current = index;
      count.textContent = formatNumber.format(index + 1) + ' از ' + formatNumber.format(numberOfDiagrams);
      status.hidden = true;
      break;
    }
    loading = false;
    previous.disabled = next.disabled = false;
    if (current < 0) {
      images.clear();
      status.textContent = 'تصویری برای نمایش پیدا نشد. فایل‌های diagram01.jpg تا diagram10.jpg را در پوشه ' + diagramFolder + ' قرار دهید.';
      status.hidden = false;
    }
    scheduleNext();
  }

  previous.addEventListener('click', () => showDiagram(current < 0 ? numberOfDiagrams - 1 : current - 1, -1));
  next.addEventListener('click', () => showDiagram(current + 1, 1));
  play.addEventListener('click', () => {
    autoplay = !autoplay;
    updatePlayLabel();
    if (autoplay && current < 0) showDiagram(0, 1);
    else scheduleNext();
  });
  updatePlayLabel();
  showDiagram(0, 1);
}
setupDiagramSlideshow();

/* Language-specific albums with per-photo Persian fallback. */
const galleryFolders={finance:'Financial',allocation:'MIS',hr:'Human',payroll:'Payroll',assets:'Inventory_Asset',office:'Office',budget:'Budgeting',fanoosh:'Fanoosh'};
const galleryLang = lang_page;
const galleryText={"album": "آلبوم تصاویر نرم‌افزار", "prev": "قبلی", "next": "بعدی", "hint": "تصویر بندانگشتی را انتخاب کنید یا از دکمه‌های قبلی و بعدی استفاده کنید. برای اندازه کامل روی تصویر اصلی بزنید.", "thumbs": "تصاویر بندانگشتی آلبوم", "photo": "تصویر", "error": "تصویر بارگذاری نشد. پوشه photos و فهرست تصاویر آن را بررسی کنید.", "persian": "تصویر رابط فارسی"};
let activeGallery=null;
function safePhotoNames(value){return Array.isArray(value)?value.filter(x=>typeof x==='string'&&x.split('/').every(v=>v&&v!=='.'&&v!=='..')&&!/[\\:\u0000-\u001f]/.test(x)&&/\.(png|jpe?g|webp|gif|avif)$/i.test(x)):[];}
function galleryItems(product) {
  const folder = galleryFolders[product.id];
  const manifest = window.MATRIS_PHOTOS || {};
  // Accept the previous manifest format while using the new folder structure.
  const previousEntry = manifest[folder];
  const previous = Array.isArray(previousEntry)
    ? { fa: previousEntry }
    : (previousEntry || {});

  function filesFor(language) {
    const filenames = manifest[language]?.[folder] ?? previous[language];
    return safePhotoNames(filenames);
  }

  const persian = [...new Set([...filesFor('fa'), ...safePhotoNames(previous.legacy)])];
  const translated = filesFor(galleryLang);
  const filenames = [...new Set([...persian, ...translated])];
  const embedded = { src: product.image, lang: 'fa' };

  function photoUrl(filename, language) {
    const relativeName = filename.split('/').map(encodeURIComponent).join('/');
    return 'photos/' + encodeURIComponent(language) + '/' + encodeURIComponent(folder) + '/' + relativeName;
  }

  return [
    { src: product.image, alt: product.alt, candidates: [embedded] },
    ...filenames.map(filename => {
      const candidates = [];
      if (galleryLang !== 'fa' && translated.includes(filename)) {
        candidates.push({ src: photoUrl(filename, galleryLang), lang: galleryLang });
      }
      if (persian.includes(filename)) {
        candidates.push({ src: photoUrl(filename, 'fa'), lang: 'fa' });
      }
      candidates.push(embedded);
      return {
        src: candidates[0].src,
        alt: product.name + ' — ' + filename.split('/').pop(),
        candidates
      };
    })
  ];
}
function loadGalleryImage(image,item,onChange,onExhausted){
 const token={};image.galleryToken=token;let index=0;
 function apply(){
  if(image.galleryToken!==token)return;
  const candidate=item.candidates[index];
  image.onerror=()=>{if(image.galleryToken!==token)return;if(index+1<item.candidates.length){index++;apply();}else{image.onerror=null;onExhausted?.();}};
  image.alt=item.alt;image.src=candidate.src;onChange?.(candidate);
 }
 apply();
}
function galleryMarkup(p){
 const count=galleryItems(p).length;
 return `<section class="photo-album" aria-label="${esc(galleryText.album)}"><div class="album-controls"><button type="button" id="album-prev" ${count<2?'disabled':''}>${esc(galleryText.prev)}</button><output id="album-count" aria-live="polite" dir="ltr">1 / ${count}</output><button type="button" id="album-next" ${count<2?'disabled':''}>${esc(galleryText.next)}</button></div><a id="album-full" href="${esc(p.image)}" target="_blank" rel="noopener noreferrer"><img class="dialog-image album-image" id="album-image" src="${esc(p.image)}" alt="${esc(p.alt)}" width="1000" height="650"></a><p class="album-language" id="album-language" aria-live="polite"></p><p class="album-hint">${esc(galleryText.hint)}</p><p class="album-error" id="album-error" aria-live="polite"></p><div class="album-thumbs" id="album-thumbs" aria-label="${esc(galleryText.thumbs)}"></div></section>`;
}
function mountGallery(p){
 const items=galleryItems(p);activeGallery={items,index:0};
 const image=document.getElementById('album-image'),thumbs=document.getElementById('album-thumbs');const buttons=[];
 function show(index){
  const state=activeGallery;if(!state)return;state.index=(index+items.length)%items.length;
  document.getElementById('album-error').textContent='';
  loadGalleryImage(image,items[state.index],candidate=>{
   document.getElementById('album-full').href=candidate.src;
   const note=document.getElementById('album-language');note.textContent=galleryLang!=='fa'&&candidate.lang==='fa'?galleryText.persian:'';note.hidden=!note.textContent;
  },()=>{document.getElementById('album-error').textContent=galleryText.error;});
  document.getElementById('album-count').textContent=(state.index+1)+' / '+items.length;
  buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===state.index)));
 }
 items.forEach((item,index)=>{
  const b=document.createElement('button');b.type='button';b.className='album-thumb';b.setAttribute('aria-label',galleryText.photo+' '+(index+1));
  const im=document.createElement('img');im.loading='lazy';
  loadGalleryImage(im,item,candidate=>{b.title=galleryLang!=='fa'&&candidate.lang==='fa'?galleryText.persian:'';},()=>{im.hidden=true;b.textContent=String(index+1);});
  b.append(im);b.addEventListener('click',()=>show(index));thumbs.append(b);buttons.push(b);
 });
 document.getElementById('album-prev').addEventListener('click',()=>show(activeGallery.index-1));
 document.getElementById('album-next').addEventListener('click',()=>show(activeGallery.index+1));
 activeGallery.show=show;show(0);
}

document.querySelector('.dialog-close').addEventListener('click',closeDialog);dialog.addEventListener('cancel',e=>{e.preventDefault();closeDialog();});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});

function validate(el){let msg='';if(el.type==='checkbox'&&!el.checked)msg='لطفاً موافقت خود را با استفاده از اطلاعات برای پاسخ به این درخواست اعلام کنید.';else if(!el.value.trim())msg=`لطفاً ${fieldLabels[el.name]} را وارد کنید.`;else if(el.validity.typeMismatch)msg='لطفاً یک نشانی ایمیل کاری معتبر وارد کنید.';else if(el.name==='message'&&el.value.trim().length<20)msg='لطفاً نیازهای خود را در حداقل ۲۰ نویسه توضیح دهید.';const parent=el.closest('.field');parent.querySelector('.field-error')?.remove();el.removeAttribute('aria-describedby');el.removeAttribute('aria-invalid');if(msg){const err=document.createElement('p');err.className='field-error';err.id=el.id+'-error';err.textContent=msg;parent.append(err);el.setAttribute('aria-describedby',err.id);el.setAttribute('aria-invalid','true');}return !msg;}
